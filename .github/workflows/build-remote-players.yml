      - name: Install Rust nightly
        run: rustup toolchain install nightly --profile minimal --target x86_64-pc-windows-msvc

      - name: Build DLL (with log file)
        if: ${{ inputs.diagnostics }}
        working-directory: upstream
        run: cargo build --release --locked --features diagnostics

      - name: Build DLL (quiet)
        if: ${{ !inputs.diagnostics }}
        working-directory: upstream
        run: cargo build --release --locked

      - name: Show SHA-256
        shell: pwsh
        run: Get-FileHash upstream/target/x86_64-pc-windows-msvc/release/ERCharacterScale.dll -Algorithm SHA256

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: ERCharacterScale-1.17.2-remote-players
          path: |
            upstream/target/x86_64-pc-windows-msvc/release/ERCharacterScale.dll
            upstream/examples/ERCharacterScale.remote-players.toml
