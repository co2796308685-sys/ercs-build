name: build-1.17.2-dll-remote-players

# Builds the author's pinned 1.17.2 commit of ERCharacterScale WITH the experimental
# "[remote_players]" patch (co-op session players get equipment retargeting on this PC).
# Run it from the Actions tab (Run workflow). Tick "diagnostics" for the first test so the DLL
# writes ERCharacterScale.log next to itself.
on:
  workflow_dispatch:
    inputs:
      diagnostics:
        description: "Write ERCharacterScale.log (recommended for the first test)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - name: Get the author's 1.17.2 commit (pinned)
        uses: actions/checkout@v4
        with:
          repository: KamiyamaShiki0704/ERCharacterScale
          ref: 9d6b66ebbdb6e04efcc44be02781976b370ab7c4
          path: upstream

      - name: Apply the remote-players patch (embedded, base64)
        shell: bash
        working-directory: upstream
        run: |
          base64 -d > remote-players.patch <<'PATCH_END'
